server {
    listen 80;

    # Docker's internal DNS; re-resolve so a recreated calculator container (new IP) is picked up
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://calculator:8085;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
